<svg width="880" height="172" viewBox="0 0 880 172" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img">
<defs>
    <linearGradient id="c-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050914"/>
      <stop offset="42%" stop-color="#0a1226"/>
      <stop offset="100%" stop-color="#14081f"/>
    </linearGradient>
    <linearGradient id="c-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="28%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="c-stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.7"/>
      <stop offset="48%" stop-color="#a78bfa" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#f0abfc" stop-opacity="0.58"/>
    </linearGradient>
    <linearGradient id="c-title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#d8b4fe"/>
    </linearGradient>
    <linearGradient id="c-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="c-orb-cyan" cx="18%" cy="12%" r="52%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="c-orb-violet" cx="90%" cy="8%" r="48%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="c-orb-pink" cx="70%" cy="100%" r="46%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <filter id="c-glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="c-noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="11"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.055"/>
      </feComponentTransfer>
    </filter>
    <pattern id="c-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <clipPath id="c-frame">
      <rect x="10" y="10" width="860" height="152" rx="30"/>
    </clipPath>
  </defs>
  <defs>
    <clipPath id="cc1"><rect x="42" y="74" width="256" height="58" rx="16"/></clipPath>
    <clipPath id="cc2"><rect x="312" y="74" width="256" height="58" rx="16"/></clipPath>
    <clipPath id="cc3"><rect x="582" y="74" width="256" height="58" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#c-frame)">
    <rect x="10" y="10" width="860" height="152" rx="30" fill="url(#c-bg)"/>
    <rect x="10" y="10" width="860" height="152" fill="url(#c-grid)"/>
    <ellipse cx="150" cy="10" rx="250" ry="130" fill="url(#c-orb-cyan)">
