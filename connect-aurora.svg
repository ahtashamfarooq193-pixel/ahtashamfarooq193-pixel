    </ellipse>
    <ellipse cx="640" cy="152" rx="260" ry="120" fill="url(#c-orb-pink)"/>
    <rect x="10" y="10" width="860" height="152" rx="30" fill="url(#c-shine)"/>
    <rect x="10" y="10" width="860" height="152" rx="30" filter="url(#c-noise)"/>
    <rect x="10" y="10" width="5" height="152" fill="url(#c-edge)"/>
  </g>
  <rect x="10.8" y="10.8" width="858.4" height="150.4" rx="29" fill="none" stroke="url(#c-stroke)" stroke-width="1.5"/>

  <rect x="42" y="30" width="8" height="8" rx="2" fill="#67e8f9">
    <animate attributeName="fill-opacity" values="1;0.35;1" dur="1.4s" repeatCount="indefinite"/>
  </rect>
  <text x="56" y="38" fill="#7dd3fc" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.6">CONNECT</text>

