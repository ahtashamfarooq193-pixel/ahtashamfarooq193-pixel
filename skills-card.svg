      <circle cx="336" cy="122" r="3.3" fill="#38bdf8"/>
      <text x="348" y="126" fill="#e8eef8" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Flutter</text>

      <circle cx="336" cy="148" r="3.3" fill="#67e8f9"/>
      <text x="348" y="152" fill="#e8eef8" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">React</text>

