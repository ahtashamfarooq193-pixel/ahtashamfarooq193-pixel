    <ellipse cx="620" cy="248" rx="250" ry="110" fill="url(#p-orb-pink)"/>
    <rect x="10" y="10" width="860" height="248" rx="28" fill="url(#p-shine)"/>
    <rect x="10" y="10" width="860" height="248" rx="28" filter="url(#p-noise)"/>
  </g>
  <rect x="10.75" y="10.75" width="858.5" height="246.5" rx="27.2" fill="none" stroke="url(#p-stroke)" stroke-width="1.4"/>
