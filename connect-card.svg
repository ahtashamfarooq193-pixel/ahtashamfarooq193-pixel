    <g>
      <rect x="42" y="58" width="244" height="40" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.10"/>
      <circle cx="60" cy="78" r="4" fill="#67e8f9"/>
      <text x="74" y="73" fill="#f8fafc" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700">Portfolio</text>
      <text x="74" y="88" fill="#9fb0c7" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5">ahtashamfarooq.netlify.app</text>
    </g>
  </a>
