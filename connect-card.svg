    <linearGradient id="c-stroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4af7a" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#e8d5b0" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#d4af7a" stop-opacity="0.18"/>
