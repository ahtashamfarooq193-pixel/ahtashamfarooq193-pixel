<svg width="880" height="128" viewBox="0 0 880 128" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img">
<defs>
    <linearGradient id="c-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07101c"/>
      <stop offset="45%" stop-color="#0b1224"/>
      <stop offset="100%" stop-color="#12081c"/>
    </linearGradient>
    <linearGradient id="c-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="38%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="c-stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#c4b5fd" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f0abfc" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="c-title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <radialGradient id="c-orb-cyan" cx="20%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="c-orb-violet" cx="88%" cy="12%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="c-orb-pink" cx="72%" cy="92%" r="48%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <filter id="c-soft" x="-8%" y="-12%" width="116%" height="130%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="c-glow">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="c-noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.045"/>
      </feComponentTransfer>
    </filter>
    <clipPath id="c-frame">
      <rect x="10" y="10" width="860" height="108" rx="28"/>
    </clipPath>
  </defs>
  <g clip-path="url(#c-frame)">
    <rect x="10" y="10" width="860" height="108" rx="28" fill="url(#c-bg)"/>
    <ellipse cx="160" cy="30" rx="230" ry="120" fill="url(#c-orb-cyan)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="7s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="760" cy="40" rx="210" ry="130" fill="url(#c-orb-violet)">
      <animate attributeName="opacity" values="1;0.75;1" dur="8s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="620" cy="108" rx="250" ry="110" fill="url(#c-orb-pink)"/>
    <rect x="10" y="10" width="860" height="108" rx="28" fill="url(#c-shine)"/>
    <rect x="10" y="10" width="860" height="108" rx="28" filter="url(#c-noise)"/>
  </g>
  <rect x="10.75" y="10.75" width="858.5" height="106.5" rx="27.2" fill="none" stroke="url(#c-stroke)" stroke-width="1.4"/>
  <rect x="18" y="18" width="844" height="92" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>

  <text x="42" y="44" fill="#f8fafc" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">Let’s build something beautiful</text>

