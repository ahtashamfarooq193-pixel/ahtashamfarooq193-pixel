      <circle cx="612" cy="78" r="4" fill="#f0abfc"/>
      <text x="626" y="73" fill="#f8fafc" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700">Email</text>
      <text x="626" y="88" fill="#9fb0c7" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5">ahtashamfarooq193@gmail.com</text>
