      <circle cx="336" cy="78" r="4" fill="#c4b5fd"/>
      <text x="350" y="73" fill="#f8fafc" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700">LinkedIn</text>
      <text x="350" y="88" fill="#9fb0c7" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5">ahtasham-webdev</text>
    </g>
